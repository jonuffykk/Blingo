<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title">
  <title id="title">Dot comemora o acerto</title>
  <style>
    .actor { transform-origin: 218px 386px }
    .left { transform-origin: 182px 221px }
    .right { transform-origin: 222px 221px }
    .mouth-live { transform-origin: 203px 194px }
    .left, .right { animation: flare 1.2s ease-out both }
    @keyframes flare { 0%, 63% { scale: .65 .88 } 29%, 49% { scale: 1.08 1 } 82% { scale: .87 1 } }
    .actor { animation: launch 1.28s cubic-bezier(.22,.73,.34,1) both }
    .spark { animation: spark 1.18s ease-out both; transform-box: fill-box; transform-origin: center }
    .spark:nth-child(2) { animation-delay: .13s }
    .spark:nth-child(3) { animation-delay: .21s }
    .shadow { animation: shadow-bounce 1.28s ease-out both }
    @keyframes launch { 0% { translate: 0 13px; scale: 1 .92 } 26% { translate: 13px -29px; rotate: -9deg } 48% { translate: -8px -40px; rotate: 7deg } 73% { translate: 0 -5px; scale: 1 .94 } 89% { translate: 0 -12px } }
    @keyframes spark { 0%, 11% { opacity: .22; translate: 0 11px; scale: .55 } 42% { opacity: 1; translate: 0 -9px; scale: 1.11 } 100% { opacity: .92 } }
    @keyframes shadow-bounce { 31%, 59% { scale: .67 1; opacity: .07 } }

    .shadow { transform-origin: 240px 423px }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
