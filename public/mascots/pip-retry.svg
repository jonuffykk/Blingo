<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Pip crouches and offers a reassuring wing</title>
  <style>
    
.open-eyes { animation: open 5.8s steps(1) infinite }
.shut-eyes { animation: shut 5.8s steps(1) infinite }
@keyframes open { 0%, 29%, 33%, 74%, 79% { opacity: 1 } 26%, 30%, 70%, 76% { opacity: 0 } }
@keyframes shut { 0%, 29%, 33%, 74%, 79% { opacity: 0 } 26%, 30%, 70%, 76% { opacity: 1 } }

    
      .actor { transform-origin: 124px 205px; animation: settle 1.05s cubic-bezier(.2,.8,.24,1) both }
      .head-live { transform-origin: 122px 121px; animation: nod 1.05s ease-in-out both }
      .front { transform-origin: 159px 167px; animation: offer .76s .17s ease-out both }
      .open-eyes { animation: soft-open 1.05s steps(1) both }
      .shut-eyes { animation: soft-shut 1.05s steps(1) both }
      @keyframes settle { 0% { transform: translateY(-13px) scaleY(1.07) } 60% { transform: translateY(3px) scaleY(.97) } }
      @keyframes nod { 0% { transform: rotate(6deg) } 47% { transform: rotate(-12deg) translateY(8px) } }
      @keyframes offer { 0% { transform: rotate(34deg) translateX(-5px) } 63% { transform: rotate(-10deg) translateX(3px) } }
      @keyframes soft-open { 0%, 65% { opacity: 1 } 28% { opacity: 0 } }
      @keyframes soft-shut { 0%, 65% { opacity: 0 } 28% { opacity: 1 } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
