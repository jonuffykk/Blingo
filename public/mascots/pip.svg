<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Pip waves and offers a ticket</title>
  <style>
    
.open-eyes { animation: open 5.8s steps(1) infinite }
.shut-eyes { animation: shut 5.8s steps(1) infinite }
@keyframes open { 0%, 29%, 33%, 74%, 79% { opacity: 1 } 26%, 30%, 70%, 76% { opacity: 0 } }
@keyframes shut { 0%, 29%, 33%, 74%, 79% { opacity: 0 } 26%, 30%, 70%, 76% { opacity: 1 } }

    
      .actor { transform-origin: 125px 203px; animation: greet 1.1s cubic-bezier(.2,.72,.22,1) both }
      .back { transform-origin: 84px 148px; animation: wave 1.15s .14s ease-in-out both }
      .head-live { transform-origin: 127px 119px; animation: look 4.5s ease-in-out infinite }
      .ticket-motion { transform-origin: 182px 145px; animation: show-ticket 1.1s .2s ease-out both }
      @keyframes greet { 0% { transform: translateY(4px) rotate(-4deg) } 32% { transform: translateY(-8px) rotate(3deg) } 64% { transform: translateY(2px) } }
      @keyframes wave { 0%, 100% { transform: rotate(0) } 21%, 54% { transform: rotate(-22deg) } 37%, 72% { transform: rotate(10deg) } }
      @keyframes look { 0%, 38%, 62%, 100% { transform: rotate(0) } 49%, 53% { transform: rotate(8deg) translateX(3px) } }
      @keyframes show-ticket { 0% { transform: translate(-10px, 8px) rotate(-14deg) } 55% { transform: translate(0, -6px) rotate(10deg) } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <g transform="translate(9 28) scale(.92)">
