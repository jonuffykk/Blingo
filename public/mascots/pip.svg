        <g class="open-eyes" stroke="none" fill="#292235"><ellipse cx="111" cy="82" rx="5.3" ry="8.4"/><ellipse cx="158" cy="79" rx="5.3" ry="8.4"/><circle cx="112.5" cy="79.4" r="1.8" fill="#fff"/><circle cx="159.5" cy="76.4" r="1.8" fill="#fff"/></g><g class="shut-eyes" fill="none" stroke-width="3.8" opacity="0"><path d="M103 85c4 3 9 3 14 0m34-3c4 3 9 3 14 0"/></g>
