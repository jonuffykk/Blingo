<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 404" role="img" aria-labelledby="title">
  <title id="title">Dot, a pink moth, fluttering</title>
  <style>
    .flight { animation: flight 4.2s ease-in-out infinite }
    .left, .right { animation: flutter 4.2s ease-in-out infinite }
    .left { transform-origin: 182px 221px }
    .right { transform-origin: 222px 221px }
    .eye-open { animation: blink-open 4.2s steps(1) infinite }
    .eye-shut { animation: blink-shut 4.2s steps(1) infinite }
    @keyframes flight {
      0%, 24%, 70%, 100% { transform: translateY(0) }
      46%, 59% { transform: translateY(-15px) }
    }
    @keyframes flutter {
      0%, 30%, 67%, 100% { transform: scaleX(1) }
      39%, 54% { transform: scaleX(.66) }
      47%, 62% { transform: scaleX(1.06) }
    }
    @keyframes blink-open { 0%, 48%, 77% { opacity: 1 } 44%, 73% { opacity: 0 } }
    @keyframes blink-shut { 0%, 48%, 77% { opacity: 0 } 44%, 73% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <g class="flight" stroke="#231b23" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
