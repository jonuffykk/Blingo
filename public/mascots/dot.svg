        <ellipse cx="112" cy="235" rx="14" ry="10" transform="rotate(-23 112 235)"/>
        <ellipse cx="144" cy="285" rx="14" ry="8" transform="rotate(-53 144 285)"/>
      </g>
    </g>
    <g class="right">
      <path fill="#efa5bc" d="M219 201c40-38 96-52 139-32 40 19 47 63 13 79 6 24-17 49-49 43 19 28 4 55-21 53-6 17-30 8-48-4-24-16-38-55-49-99Z"/>
      <path fill="#92355f" stroke="none" d="M221 207c45-34 98-48 129-24 22 16 18 37-1 45 5 21-18 39-42 34-27-5-53-23-86-55Zm-4 24c34 21 72 51 84 77 7 16-4 27-15 21-9 14-29 2-43-19-11-19-20-42-26-79Z"/>
