        <ellipse cx="257" cy="285" rx="14" ry="8" transform="rotate(53 257 285)"/>
      </g>
    </g>
    <path fill="#92355f" d="M193 275c-11 22-11 65-3 67 8 3 9-37 13-45 2 10 4 45 11 44 8 0 5-43-4-67Z"/>
    <path fill="#efb0ba" d="M176 213c-12 27-9 72 27 101 35-24 44-64 25-101Z"/>
    <path fill="none" stroke="#df8b9e" stroke-width="5" d="M180 253c11 10 30 13 43 5m-38 22c10 4 25 4 35 1"/>
