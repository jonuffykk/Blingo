  <title id="title">Pebble encoraja uma nova tentativa</title>
  <style>
    .actor { transform-origin: 241px 386px }
    .head { transform-origin: 265px 267px }
    .mouth-live { transform-origin: 371px 170px }
    .paw { transform-origin: 306px 280px }
    .head { animation: tuck 1.48s ease-in-out both }
    @keyframes tuck { 0% { translate: 7px -3px } 42% { translate: -21px 9px } 73% { translate: -13px 5px } }
    .actor { animation: recover 1.45s ease-in-out both }
    .heart { animation: heart 1.42s ease-out both; transform-box: fill-box; transform-origin: center }
    @keyframes recover { 0% { scale: 1 } 38% { translate: -6px 8px; scale: 1.04 .91 } 74% { translate: 3px 1px; scale: .97 1.01 } }
    @keyframes heart { 0%, 24% { opacity: .22; scale: .62; translate: 0 12px } 68% { opacity: 1; scale: 1.08; translate: 0 -4px } }

    .eye-open { animation: eyes-open 2.9s steps(1) infinite }
    .eye-shut { animation: eyes-shut 2.9s steps(1) infinite }
    @keyframes eyes-open { 0%, 56%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes eyes-shut { 0%, 56%, 100% { opacity: 0 } 50% { opacity: 1 } }

    .shadow { transform-origin: 240px 423px }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
