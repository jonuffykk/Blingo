<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13 -37 450 450" role="img" aria-labelledby="title">
  <title id="title">Moxie, a fox wearing plum boots</title>
  <style>
    .tail, .ears { transform-box: fill-box }
    .tail { animation: swish 4.4s ease-in-out infinite; transform-origin: 11% 81% }
    .ears { animation: perk 4.4s ease-in-out infinite; transform-origin: center bottom }
    .face { animation: look 4.4s ease-in-out infinite; transform-origin: 121px 220px }
    .eye-open { animation: blink-open 4.4s steps(1) infinite }
    .eye-shut { animation: blink-shut 4.4s steps(1) infinite }
    @keyframes swish {
      0%, 43%, 75%, 100% { transform: rotate(0) }
      54% { transform: rotate(-14deg) }
      66% { transform: rotate(7deg) }
    }
    @keyframes perk {
      0%, 51%, 66%, 100% { transform: scaleY(1) }
      58% { transform: scaleY(1.07) }
    }
    @keyframes look { 0%, 31%, 77%, 100% { transform: rotate(0) } 44%, 64% { transform: rotate(-8deg) } }
    @keyframes blink-open { 0%, 39%, 73% { opacity: 1 } 35%, 69% { opacity: 0 } }
    @keyframes blink-shut { 0%, 39%, 73% { opacity: 0 } 35%, 69% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
