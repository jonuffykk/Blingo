<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Pip presents a gold achievement star</title>
  <style>
    
.open-eyes { animation: open 5.8s steps(1) infinite }
.shut-eyes { animation: shut 5.8s steps(1) infinite }
@keyframes open { 0%, 29%, 33%, 74%, 79% { opacity: 1 } 26%, 30%, 70%, 76% { opacity: 0 } }
@keyframes shut { 0%, 29%, 33%, 74%, 79% { opacity: 0 } 26%, 30%, 70%, 76% { opacity: 1 } }

    
      .actor { transform-origin: 123px 198px; animation: step 1.28s cubic-bezier(.22,.75,.26,1) both }
      .head-live { transform-origin: 125px 119px; animation: bow 1.28s ease-in-out both }
      .prize-motion { transform-origin: 194px 139px; animation: lift 1.28s cubic-bezier(.15,.73,.32,1) both }
      .lights { transform-origin: 125px 106px; animation: glint 1.28s ease-out both }
      .front { transform-origin: 165px 155px; animation: present 1.28s ease-in-out both }
      .back { transform-origin: 82px 156px; animation: flourish .95s .16s ease-out both }
      @keyframes step { 0% { transform: translate(-12px,3px) rotate(5deg) } 33% { transform: translate(-4px,-13px) rotate(-5deg) } 64% { transform: translate(2px,2px) rotate(2deg) } }
      @keyframes bow { 0%, 65% { transform: rotate(0) } 39% { transform: rotate(13deg) translate(4px,3px) } }
      @keyframes lift { 0% { transform: translate(-25px,21px) rotate(-33deg) scale(.73) } 39% { transform: translate(-10px,10px) rotate(-13deg) scale(.94) } 78% { transform: translate(0,-9px) rotate(11deg) scale(1.17) } }
      @keyframes present { 0% { transform: rotate(25deg) } 45% { transform: rotate(18deg) } 75% { transform: rotate(-12deg) } }
      @keyframes flourish { 0% { transform: rotate(-18deg) } 55% { transform: rotate(13deg) } }
      @keyframes glint { 0%, 49% { opacity: 0; transform: scale(.72) } 75% { opacity: 1; transform: scale(1.18) } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
