<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title">
  <title id="title">Moxie encoraja uma nova tentativa</title>
  <style>
    .actor { transform-origin: 200px 386px }
    .tail { transform-origin: 249px 293px }
    .face { transform-origin: 121px 220px }
    .mouth-live { transform-origin: 60px 137px }
    .paw { transform-origin: 91px 250px }
    .face, .tail { animation: tuck 1.35s ease-in-out both }
    @keyframes tuck { 0% { rotate: -4deg } 35%, 61% { rotate: 10deg } }
    .actor { animation: recover 1.45s ease-in-out both }
    .heart { animation: heart 1.42s ease-out both; transform-box: fill-box; transform-origin: center }
    @keyframes recover { 0% { rotate: -2deg } 38% { translate: 0 10px; rotate: 6deg; scale: 1 .94 } 68% { translate: 0 4px; rotate: -3deg } }
    @keyframes heart { 0%, 24% { opacity: .22; scale: .62; translate: 0 12px } 68% { opacity: 1; scale: 1.08; translate: 0 -4px } }

    .eye-open { animation: eyes-open 2.9s steps(1) infinite }
    .eye-shut { animation: eyes-shut 2.9s steps(1) infinite }
    @keyframes eyes-open { 0%, 56%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes eyes-shut { 0%, 56%, 100% { opacity: 0 } 50% { opacity: 1 } }

    .shadow { transform-origin: 240px 423px }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
