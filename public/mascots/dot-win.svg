<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title">
  <title id="title">Dot celebra a lição concluída</title>
  <style>
    .actor { transform-origin: 218px 386px }
    .left { transform-origin: 182px 221px }
    .right { transform-origin: 222px 221px }
    .mouth-live { transform-origin: 203px 194px }
    .left, .right { animation: flutter 2.85s ease-in-out infinite }
    @keyframes flutter { 0%, 16%, 59%, 100% { scale: 1 } 29%, 71% { scale: .84 1.02 } 41%, 83% { scale: 1.03 .99 } }
    .actor { animation: settle 2.85s ease-in-out infinite }
    .award { animation: award 1.22s cubic-bezier(.22,.73,.34,1) both; transform-box: fill-box; transform-origin: center bottom }
    .spark { animation: glimmer 2.4s ease-in-out infinite }
    .spark:nth-child(2) { animation-delay: .38s }
    .spark:nth-child(3) { animation-delay: .72s }
    @keyframes settle { 0%, 100% { translate: 0 0 } 28% { translate: 2px -17px; rotate: -4deg } 59% { translate: -2px -8px; rotate: 3deg } }
    @keyframes award { 0%, 22% { scale: .75; rotate: -12deg; translate: 0 21px; opacity: .27 } 63% { scale: 1.09; rotate: 7deg; opacity: 1 } }
    @keyframes glimmer { 0%, 100% { opacity: .46; translate: 0 0 } 43% { opacity: 1; translate: 0 -5px } }

    .shadow { transform-origin: 240px 423px }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
