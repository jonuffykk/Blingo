<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 454 454" role="img" aria-labelledby="title">
  <title id="title">Echo, a frog cupping a hand to listen</title>
  <style>
    .hand { animation: listen 4.2s ease-in-out infinite; transform-origin: 325px 241px }
    .sound { animation: pop 4.2s ease-in-out infinite; transform-origin: 351px 139px }
    .eye-open { animation: blink-open 4.9s steps(1) infinite }
    .eye-shut { animation: blink-shut 4.9s steps(1) infinite }
    .mouth { animation: sing 4.2s ease-in-out infinite; transform-origin: 215px 175px }
    @keyframes listen {
      0%, 18%, 52%, 100% { transform: rotate(0) }
      29%, 42% { transform: rotate(-17deg) }
    }
    @keyframes pop {
      0%, 19%, 54%, 100% { transform: scale(1); opacity: 1 }
      35% { transform: scale(1.18); opacity: .68 }
    }
    @keyframes blink-open { 0%, 31%, 78% { opacity: 1 } 28%, 74% { opacity: 0 } }
    @keyframes blink-shut { 0%, 31%, 78% { opacity: 0 } 28%, 74% { opacity: 1 } }
    @keyframes sing { 0%, 20%, 52%, 100% { transform: scaleY(1) } 33%, 43% { transform: scaleY(.55) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
