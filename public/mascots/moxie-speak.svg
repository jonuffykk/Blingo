<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title">
  <title id="title">Moxie fala</title>
  <style>
    .actor { transform-origin: 200px 386px }
    .tail { transform-origin: 249px 293px }
    .face { transform-origin: 121px 220px }
    .mouth-live { transform-origin: 60px 137px }
    .paw { transform-origin: 91px 250px }
    .face, .tail { animation: perk 1.62s ease-in-out infinite }
    .tail { animation-delay: .13s }
    @keyframes perk { 0%, 100% { rotate: 0deg } 31% { rotate: -6deg } 70% { rotate: 4deg } }
    .actor { animation: speak-gesture 1.65s ease-in-out infinite }
    .mouth-live { animation: syllables .88s ease-in-out infinite }
    .voice path { animation: sound 1.12s ease-out infinite }
    .voice path:nth-child(2) { animation-delay: .13s }
    .voice path:nth-child(3) { animation-delay: .26s }
    @keyframes speak-gesture { 0%, 100% { translate: 0 0 } 34% { translate: 0 -5px; rotate: -2deg } 68% { rotate: 1deg } }
    @keyframes syllables { 0%, 47%, 88%, 100% { scale: 1 .35 } 15%, 65% { scale: .91 1.26 } 35% { scale: 1 .89 } }
    @keyframes sound { 0%, 100% { opacity: .38; translate: -3px 4px } 48% { opacity: 1; translate: 5px -3px } }

    .eye-open { animation: eyes-open 2.9s steps(1) infinite }
    .eye-shut { animation: eyes-shut 2.9s steps(1) infinite }
    @keyframes eyes-open { 0%, 56%, 100% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes eyes-shut { 0%, 56%, 100% { opacity: 0 } 50% { opacity: 1 } }

    .shadow { transform-origin: 240px 423px }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
