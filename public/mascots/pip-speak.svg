    <g class="actor"><g transform="translate(4 4)">
      <g class="tail"><path fill="#863b70" d="M85 173c-19-14-39-15-44-5-3 6 4 12 14 17-18-5-24 3-19 10 5 8 25 8 40 2-8 5-11 11-4 14 9 4 22-5 27-13Z"/><path fill="none" stroke="#603257" stroke-width="2.8" d="M61 190c7 1 11 1 17-1"/></g>
      <path fill="#ffca69" d="m101 185-5 18c-9 0-21 6-20 11 1 4 8 5 16 2-1 5 7 6 13 2l10-7c3-2 1-8-5-8l5-17Zm32 3 7 17c-4 4-2 9 4 9 6-1 12 0 19 4 6 4 12 0 9-4 7 2 13-1 11-5-3-7-17-10-29-7l-6-16Z"/>
