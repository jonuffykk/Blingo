<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Pip leans in to pronounce the phrase</title>
  <style>
    
.open-eyes { animation: open 5.8s steps(1) infinite }
.shut-eyes { animation: shut 5.8s steps(1) infinite }
@keyframes open { 0%, 29%, 33%, 74%, 79% { opacity: 1 } 26%, 30%, 70%, 76% { opacity: 0 } }
@keyframes shut { 0%, 29%, 33%, 74%, 79% { opacity: 0 } 26%, 30%, 70%, 76% { opacity: 1 } }

    
      .actor { transform-origin: 124px 201px; animation: lean 1s ease-in-out both }
      .head-live { transform-origin: 130px 120px; animation: enunciate 1.32s ease-in-out 3 }
      .talk-mouth { transform-origin: 139px 94px; animation: syllables 1.32s ease-in-out 3 }
      .front { transform-origin: 166px 151px; animation: cup 1.32s ease-in-out 3 }
      .sound { transform-origin: 202px 77px; animation: sound 1.32s ease-in-out 3 }
      @keyframes lean { 0% { transform: translateX(-8px) rotate(-7deg) } 66% { transform: translateX(3px) rotate(3deg) } }
      @keyframes enunciate { 0%, 100% { transform: rotate(0) } 20%, 68% { transform: rotate(5deg) translate(2px,1px) } 37%, 87% { transform: rotate(-4deg) translateY(-2px) } }
      @keyframes syllables { 0%, 19%, 50%, 75%, 100% { transform: scaleY(.36) } 9%, 42%, 60%, 86% { transform: scaleY(1.12) } }
      @keyframes cup { 0%, 100% { transform: rotate(0) } 22%, 67% { transform: rotate(-12deg) } 52%, 85% { transform: rotate(4deg) } }
      @keyframes sound { 0%, 100% { opacity: .45; transform: scale(.9) } 22%, 66% { opacity: 1; transform: scale(1.14) } 42%, 89% { opacity: .55; transform: scale(.96) } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <g transform="translate(9 28) scale(.92)">
  <ellipse class="shadow" cx="123" cy="221" rx="52" ry="7" fill="currentColor" opacity=".10"/>
  <g stroke="#292235" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
