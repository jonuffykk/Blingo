  <path fill="#ffa142" d="M93 118c-15 12-24 34-22 52 3 25 26 39 61 39 26 0 48-15 50-37 2-22-11-45-28-53Z"/>
  <path fill="#ec7437" stroke="none" d="M170 141c5 12 7 23 3 33-7 22-37 30-64 27-15-2-27-7-34-16 8 14 28 24 57 24 26 0 48-15 50-37 1-12-4-24-12-31Z"/>
  <path fill="#ffbb68" stroke="none" d="M105 153c12-9 34-8 48 2 15 11 11 28-1 36-15 8-54 8-60-5-5-11 1-24 13-33Z"/>

      <g class="head-live"><g transform="rotate(10 126 124) translate(4 2)">
        
  <path fill="#ffa142" d="M74 108c-13-11-15-30-6-47 7-13 20-21 35-24-11-3-19-10-17-16 3-7 19-6 33 8-6-15 0-25 6-23 7 2 10 16 9 26 20-5 42 6 52 22 11 17 10 37-1 52-9 15-29 25-57 26-25 1-43-7-54-24Z"/>
  <path fill="#fff1c5" stroke="none" d="M85 87c0-16 8-29 21-31 12-2 21 7 25 16 5-15 17-22 29-20 15 3 25 18 25 35 0 21-23 38-51 39-27 1-49-13-49-39Z"/>
  <path fill="#f58f70" stroke="none" d="M89 97c4-3 13-3 16 0 3 4-2 7-8 7-6 0-10-3-8-7Zm81-4c4-2 10-2 13 1 2 4-2 6-6 6-6 0-9-3-7-7Z"/>

        <g class="open-eyes" stroke="none" fill="#292235"><ellipse cx="114" cy="83" rx="5.5" ry="8.1"/><ellipse cx="160" cy="80" rx="5.3" ry="8.1"/><circle cx="116" cy="80.5" r="1.7" fill="#fff"/><circle cx="162" cy="77.5" r="1.7" fill="#fff"/></g><g class="shut-eyes" fill="none" stroke-width="3.8" opacity="0"><path d="M103 85c4 3 9 3 14 0m34-3c4 3 9 3 14 0"/></g>
