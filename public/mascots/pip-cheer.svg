<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Pip throws both wings up in a jump</title>
  <style>
    
    
      .actor { transform-origin: 123px 204px; animation: leap 1.12s cubic-bezier(.21,.72,.33,1) both }
      .back { transform-origin: 82px 149px; animation: stretch-left 1.12s ease-out both }
      .front { transform-origin: 171px 149px; animation: stretch-right 1.12s ease-out both }
      .shadow { transform-origin: 125px 221px; animation: shadow 1.12s ease-out both }
      .burst { transform-origin: 120px 65px; animation: sparks 1.12s ease-out both }
      @keyframes leap { 0% { transform: translateY(6px) scaleY(.92) } 20% { transform: translateY(-17px) rotate(-9deg) scaleY(1.07) } 42% { transform: translateY(-30px) rotate(7deg) } 70% { transform: translateY(2px) scaleY(.93) } 84% { transform: translateY(-4px) scaleY(1.03) } }
      @keyframes stretch-left { 0% { transform: rotate(-20deg) } 29% { transform: rotate(20deg) } 71% { transform: rotate(-12deg) } }
      @keyframes stretch-right { 0% { transform: rotate(18deg) } 29% { transform: rotate(-18deg) } 71% { transform: rotate(11deg) } }
      @keyframes shadow { 27%, 48% { transform: scaleX(.64); opacity: .56 } }
      @keyframes sparks { 0%, 15% { opacity: .3; transform: translateY(9px) scale(.79) } 48% { opacity: 1; transform: translateY(-8px) scale(1.1) } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
