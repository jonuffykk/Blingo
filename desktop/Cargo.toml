[package]
name = "blingo"
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[[bin]]
name = "Blingo"
path = "main.rs"

[dependencies]
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }

[build-dependencies]
tauri-winres = "0.3.7"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
