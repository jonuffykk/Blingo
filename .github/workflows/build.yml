name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blingo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version and changelog
        id: metadata
        run: node .github/scripts/release-info.mjs "$RUNNER_TEMP/release-notes.md"
      - run: npm ci
      - run: npm run build
      - name: Check site output
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          node --check dist/sw.js

  release:
    name: Publish Windows release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BLINGO_VERSION: ${{ needs.check.outputs.version }}
      BLINGO_RUST: '1.98.0'
    steps:
      - name: Check release status
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:BLINGO_VERSION"
          $status = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq ('.[] | select(.tag_name == "' + $tag + '") | .draft')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status -eq 'false') {
            Write-Output "Blingo $tag is already published."
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($refs -ccontains "refs/tags/$tag") {
            $commit = gh api "repos/$env:GH_REPO/commits/$tag" --jq .sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($commit -ne $env:GITHUB_SHA) { throw "Tag $tag points to another commit. Bump the version." }
          }
          'publish=true' >> $env:GITHUB_OUTPUT
          "draft=$($status -eq 'true')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run build
      - name: Build Windows x64 and ARM64
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          $targets = @(
            @{ arch = 'x64'; triple = 'x86_64-pc-windows-msvc'; machine = 0x8664 }
            @{ arch = 'arm64'; triple = 'aarch64-pc-windows-msvc'; machine = 0xAA64 }
          )
          rustup toolchain install $env:BLINGO_RUST --profile minimal --target 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'blingo-release')
          $hashes = foreach ($target in $targets) {
            rustup run $env:BLINGO_RUST cargo build --locked --release --manifest-path desktop/Cargo.toml --target $target.triple | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Get-Item -LiteralPath "desktop/target/$($target.triple)/release/Blingo.exe"
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($exe.FullName))
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Missing DOS header.' }
              $reader.BaseStream.Position = 0x3C
              $reader.BaseStream.Position = $reader.ReadInt32()
              if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Missing PE header.' }
              if ($reader.ReadUInt16() -ne $target.machine) { throw "Unexpected architecture for $($target.arch)." }
            } finally {
              $reader.Dispose()
            }
            if ($exe.VersionInfo.ProductVersion -ne $env:BLINGO_VERSION) { throw 'Unexpected executable version.' }
            $name = "Blingo-Windows-$($target.arch).exe"
            $path = Join-Path $output.FullName $name
            Copy-Item -LiteralPath $exe.FullName -Destination $path
            (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() + "  $name"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $output.FullName 'SHA256SUMS.txt') -Encoding ascii
          node .github/scripts/release-info.mjs (Join-Path $output.FullName 'notes.md')
      - name: Publish executables and release notes
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_DRAFT: ${{ steps.plan.outputs.draft }}
        run: |
          $tag = "v$env:BLINGO_VERSION"
          Set-Location -LiteralPath (Join-Path $env:RUNNER_TEMP 'blingo-release')
          if ($env:RELEASE_DRAFT -eq 'true') {
            gh release edit $tag --target $env:GITHUB_SHA --title "Blingo $tag" --notes-file notes.md
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Blingo $tag" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag Blingo-Windows-x64.exe Blingo-Windows-arm64.exe SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
